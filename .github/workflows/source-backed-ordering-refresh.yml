name: Source-backed Ordering Refresh

on:
  workflow_dispatch:

concurrency:
  group: source-backed-ordering-refresh
  cancel-in-progress: false

jobs:
  refresh-ordering-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VINOSMITH_API_TOKEN: ${{ secrets.VINOSMITH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - name: Generate QuickBooks and Vinosmith ordering run
        run: node scripts/refresh-source-backed-ordering.mjs
